[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aerosense"
version = "0.1.0"
description = "AeroSense — AI-based air quality index prediction and analysis using machine learning"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "AeroSense" }]
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "joblib",
    "matplotlib",
    "seaborn",
    "plotly",
    "requests",
    "streamlit",
    "pyyaml",
    "python-dateutil",
]

[project.optional-dependencies]
dev = ["pytest", "ipython"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-ra -q"